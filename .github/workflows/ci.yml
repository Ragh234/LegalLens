name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The actual project lives one level down from the repo root.
        working-directory: LegalLens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -q

    # All 9 tests run against fakes/mocks (FakeEmbedder, FakeStore, a
    # monkeypatched Gemini client) — no live Qdrant instance or
    # GEMINI_API_KEY needed.
