services:
  qdrant:
    image: qdrant/qdrant:v1.9.7
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  legallens:
    build: .
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./data/contracts:/app/data/contracts
    depends_on:
      - qdrant

volumes:
  qdrant_data:

